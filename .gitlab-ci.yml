# FORK: GitLab CI equivalent of .github/workflows/docker.yaml, reduced to the
# "slim" variant (USE_SLIM=true) for linux/amd64 only.
#
# Pushes to the local GitLab Container Registry ($CI_REGISTRY / $CI_REGISTRY_IMAGE):
#   <version>-slim         version from package.json, e.g. 0.11.4-slim
#   git-<short-sha>-slim   every build
#   <branch|tag>-slim      e.g. main-slim, v0.11.4-slim
#   slim, latest-slim      on release tags and the default branch (latest-slim = build cache)
#
# Requires a runner that can run docker:dind (privileged).

stages:
  - build

variables:
  DOCKER_TLS_CERTDIR: '/certs'
  DOCKER_BUILDKIT: '1'
  PLATFORM: linux/amd64
  VARIANT: slim
  SUFFIX: '-slim'
  CACHE_FROM: $CI_REGISTRY_IMAGE:latest-slim # inline cache of the last default-branch build

build-slim-amd64:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  tags: [docker] # set runner tags here if required
  timeout: 1h
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH    
    - if: $CI_COMMIT_TAG =~ /^v/
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker info

  script:
    # Version from package.json (same source as the app version)
    - VERSION=$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n1)
    - REF_SLUG=$(echo "${CI_COMMIT_TAG:-$CI_COMMIT_REF_NAME}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
    - IMAGE_TAG=$CI_REGISTRY_IMAGE:${VERSION}${SUFFIX}
    - |
      EXTRA_TAGS="$CI_REGISTRY_IMAGE:git-${CI_COMMIT_SHORT_SHA}${SUFFIX} $CI_REGISTRY_IMAGE:${REF_SLUG}${SUFFIX}"
      # release tags and default branch also update the moving tags (latest-slim = build cache)
      if [ -n "$CI_COMMIT_TAG" ] || [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        EXTRA_TAGS="$EXTRA_TAGS $CI_REGISTRY_IMAGE:${VARIANT} $CI_REGISTRY_IMAGE:latest${SUFFIX}"
      fi
    - echo "Build Image $IMAGE_TAG ($PLATFORM)"

    # Same Dockerfile tweak as the GitHub workflow: more heap for the frontend build
    - |
      awk '
        /^FROM --platform=\$BUILDPLATFORM node:/ {
          print
          print "ENV NODE_OPTIONS=\"--max-old-space-size=12288\""
          next
        }
        { print }
      ' Dockerfile > Dockerfile.ci

    - docker pull $CACHE_FROM || echo "No cache image found, continuing without cache."
    - |
      docker build \
        --platform $PLATFORM \
        -f Dockerfile.ci \
        --cache-from=$CACHE_FROM \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --build-arg BUILD_HASH=$CI_COMMIT_SHA \
        --build-arg USE_SLIM=true \
        --label org.opencontainers.image.source=$CI_PROJECT_URL \
        --label org.opencontainers.image.revision=$CI_COMMIT_SHA \
        --label org.opencontainers.image.version=$VERSION \
        -t $IMAGE_TAG \
        .
    - docker push $IMAGE_TAG
    - |
      for tag in $EXTRA_TAGS; do
        docker tag $IMAGE_TAG $tag
        docker push $tag
      done
